<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Shot Diagram</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="presentation-wrapper">
        <h1 class="main-title">What Happens When You Click to Shoot? (Distributed Computing)</h1>
        
        <div class="diagram-container">
            
            <!-- LEFT: CLIENT -->
            <div class="box client" id="client-box">
                <h2 class="box-title">Player (Client)</h2>
                
                <div class="action-text" id="action-click">
                    ⭐ CLICK!
                </div>
                
                <div class="action-text result-text" id="action-result">
                    🎯 Hitmarker Displayed
                </div>
            </div>

            <!-- MIDDLE: NETWORK -->
            <div class="network-area">
                <div class="network-line"></div>
                <div class="network-label">INTERNET</div>
                
                <!-- Packets that move -->
                <div class="packet packet-out" id="packet-send">
                    Data: "I Fired!"
                </div>
                
                <div class="packet packet-in" id="packet-return">
                    Result: "Target Hit"
                </div>
            </div>

            <!-- RIGHT: SERVER -->
            <div class="box server" id="server-box">
                <h2 class="box-title">Game Server</h2>
                
                <div class="action-text" id="action-calc">
                    🔍 Checking position...
                </div>
                
                <div class="action-text success-text" id="action-confirm">
                    ✅ Hit Confirmed!
                </div>
            </div>
            
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
